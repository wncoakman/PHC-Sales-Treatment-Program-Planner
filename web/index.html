<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHC Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PHC Planner">
<meta name="theme-color" content="#2f6b3a">
<style>
  :root { --fg:#1b1b1b; --muted:#666; --line:#ddd; --bg:#fff; --alt:#f4f4f4; --accent:#2f6b3a;
          --info:#1f5fae; --caution:#a85d00; --stop:#b3261e; --ok:#2e7d32; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#eee; --muted:#aaa; --line:#333; --bg:#121212; --alt:#1e1e1e; --accent:#7fbf8a;
            --info:#8ab4f8; --caution:#f0a64a; --stop:#f28b82; --ok:#81c995; }
  }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:16px/1.4 -apple-system, system-ui, sans-serif; color:var(--fg); background:var(--bg);
         padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  header { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line);
           padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display:flex; gap:8px; align-items:center; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header a { color:var(--accent); font-weight:600; text-decoration:none; }
  header button#update { font:inherit; font-size:14px; font-weight:600; color:var(--accent); background:none;
         border:1px solid var(--accent); border-radius:14px; padding:3px 10px; white-space:nowrap; }
  header button#update:disabled { opacity:.6; }
  header button#bug { font-size:17px; line-height:1; background:none; border:1px solid var(--line); border-radius:14px; padding:3px 8px; }
  .sheet { position:fixed; inset:0; z-index:12; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; }
  .sheet form { background:var(--bg); width:100%; max-width:560px; border-radius:14px 14px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin:0 0 8px; }
  .sheet textarea { width:100%; min-height:130px; font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  .sheet .row { border:0; padding:6px 0; }
  .sheet .buttons { display:flex; gap:8px; } .sheet .buttons > * { flex:1; margin:8px 0 0; }
  main { padding: 8px 16px 24px; max-width: 760px; margin: 0 auto; }
  nav.tabs { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--alt); border-top:1px solid var(--line);
             padding-bottom: env(safe-area-inset-bottom); z-index:2; }
  nav.tabs a { flex:1; text-align:center; padding:14px 0; color:var(--muted); text-decoration:none; font-weight:600; }
  nav.tabs a.on { color:var(--accent); }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:20px 0 6px; }
  h3 { font-size:17px; margin:18px 0 6px; }
  h4 { font-size:14px; margin:14px 0 4px; color:var(--accent); }
  label.row, .row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row > span:first-child { flex:1; }
  input[type=text], input[type=number], input[type=search], select { font:inherit; padding:8px; border:1px solid var(--line);
         border-radius:6px; background:var(--bg); color:var(--fg); min-width:0; }
  input[type=search] { width:100%; margin:8px 0; }
  .row input[type=number] { width:90px; } .row select { max-width:60%; }
  input[type=checkbox] { width:22px; height:22px; flex:none; }
  .seg { display:flex; gap:0; } .seg button { flex:1; padding:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font:inherit; }
  .seg button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.primary, a.primary { display:block; width:100%; text-align:center; padding:12px; margin:14px 0 6px; border:0; border-radius:8px;
         background:var(--accent); color:#fff; font:inherit; font-weight:600; text-decoration:none; }
  button.primary:disabled { opacity:.4; }
  button.link { background:none; border:0; color:var(--stop); font:inherit; padding:8px 0; }
  .opt { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .opt.notAdvised .title { text-decoration: line-through; }
  .opt.unavailable { opacity:.55; }
  form.addProduct { display:flex; flex-direction:column; gap:8px; padding:10px 0 14px; border-bottom:1px solid var(--line); }
  form.addProduct button.primary { margin:0; }
  .title { font-weight:600; }
  .small { font-size:13px; } .muted { color:var(--muted); }
  .status-inWindow { color:var(--ok); } .status-outOfWindow { color:var(--caution); } .status-notAdvised { color:var(--stop); }
  .flag { font-size:13px; margin:3px 0; padding-left:22px; position:relative; }
  .flag::before { position:absolute; left:0; font-weight:700; }
  .flag.info::before { content:"ⓘ"; color:var(--info); } .flag.caution::before { content:"⚠"; color:var(--caution); }
  .flag.stop::before { content:"⛔"; }
  ul { margin:4px 0; padding-left:20px; } li { margin:2px 0; }
  a.item { display:block; padding:12px 0; border-bottom:1px solid var(--line); color:var(--fg); text-decoration:none; }
  a.item::after { content:"›"; float:right; color:var(--muted); }
  .chip { display:inline-block; font-size:12px; padding:1px 6px; border:1px solid var(--line); border-radius:10px; color:var(--muted); }
  .banner { background:var(--alt); padding:10px 12px; border-radius:8px; font-size:13px; margin:10px 0; }
  h3.plant { font-size:19px; margin:26px 0 4px; padding-top:10px; border-top:3px solid var(--accent); }
  .group { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:10px 0 0; }
  .sub { margin-left:6px; padding-left:12px; border-left:3px solid var(--line); }
  .fits { color:var(--info); font-weight:600; }
  a[data-jump] { cursor:pointer; text-decoration:underline; color:inherit; }
  .chip.pref { color:var(--ok); border-color:var(--ok); }
  details summary { cursor:pointer; }
  #view > details:not([class]) > summary { margin-top:20px; }
  details.alts summary { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:10px 0 4px; }
  a.primary + a.primary { margin-top:0; }
  button.secondary, label.secondary { display:block; width:100%; padding:11px; margin:8px 0; border:1px solid var(--accent); border-radius:8px;
         background:none; color:var(--accent); font:inherit; font-weight:600; }
  /* Plan screen: one-line summaries that expand on tap. */
  .jobline { margin:4px 0 8px; }
  .stats { background:var(--alt); border-radius:8px; padding:10px 12px; font-size:15px; }
  .stats a { float:right; font-size:13px; }
  .hint { text-transform:none; letter-spacing:0; font-weight:400; font-size:12px; color:var(--muted); }
  details.plant, details.visit, details.section { border-bottom:1px solid var(--line); }
  details.plant > summary, details.visit > summary, details.section > summary { list-style:none; margin:0; padding:12px 24px 12px 0; position:relative; }
  details.plant > summary::-webkit-details-marker, details.visit > summary::-webkit-details-marker, details.section > summary::-webkit-details-marker { display:none; }
  details.plant > summary::after, details.visit > summary::after, details.section > summary::after { content:"›"; position:absolute; right:4px; top:10px;
         font-size:20px; color:var(--muted); transition:transform .15s; }
  details[open].plant > summary::after, details[open].visit > summary::after, details[open].section > summary::after { transform:rotate(90deg); }
  details.plant > summary .name, details.visit > summary .name { display:block; font-weight:600; font-size:17px; }
  details.plant > summary .small, details.visit > summary .small { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  details[open].plant > summary .small { white-space:normal; }
  details.plant[open] { padding-bottom:10px; }
  details.section > summary { font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; margin-top:12px; }
  details.visit ul { margin:0 0 10px; }
  details.notes > summary, details.more > summary { margin:2px 0; font-size:13px; color:var(--muted); }
  details.notes { margin:4px 0; }
  details.more > div { padding:4px 0 2px; }
  details.more > div > div { margin:2px 0; }
  .opt .body { flex:1; min-width:0; }
  .opt label.title { display:block; }
  .opt select { padding:2px 4px; font-size:13px; }
  .capture { display:flex; gap:8px; margin-top:10px; }
  .capture > * { flex:1; margin:0; text-align:center; font-size:14px; padding:10px 6px; cursor:pointer; }
  #gpsText { margin:6px 0 2px; }
  .thumbs { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 4px; }
  .thumb { position:relative; }
  .thumb img { width:84px; height:84px; object-fit:cover; border-radius:6px; display:block; }
  .thumb button { position:absolute; top:-6px; right:-6px; width:24px; height:24px; border-radius:12px; border:0;
         background:var(--stop); color:#fff; font:700 15px/24px sans-serif; padding:0; }
  .gpsTools { display:flex; gap:16px; flex-wrap:wrap; }
  .gpsTools button.link { color:var(--accent); font-size:14px; }
  .gpsTools button.link:disabled { color:var(--muted); }
  form.manual { display:flex; gap:8px; margin:4px 0 8px; }
  form.manual input { flex:1; }
  form.manual button.secondary { width:auto; margin:0; padding:8px 16px; }
  #addCustom { display:flex; gap:8px; margin:4px 0 8px; }
  #addCustom button.secondary { width:auto; margin:0; padding:8px 16px; }
  #gpsWarn:empty { display:none; }
  /* Fine-tune map: full screen; the crosshair stays put while the imagery moves under it. */
  body.mapOpen { overflow:hidden; }
  .mapScreen { position:fixed; inset:0; z-index:10; background:#1f2a1f; color:#fff; }
  .mapScreen canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; }
  .crosshair { position:absolute; left:50%; top:50%; width:44px; height:44px; margin:-22px 0 0 -22px; pointer-events:none;
         background:linear-gradient(#ff3b30,#ff3b30) center/2px 100% no-repeat, linear-gradient(#ff3b30,#ff3b30) center/100% 2px no-repeat;
         filter:drop-shadow(0 0 1.5px #000); }
  .crosshair::after { content:""; position:absolute; inset:14px; border:2px solid #ff3b30; border-radius:50%; }
  .mapTop { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:8px;
         padding:calc(10px + env(safe-area-inset-top)) 12px 10px; background:rgba(0,0,0,.6); }
  .mapTop b { flex:1; text-align:center; }
  .mapScreen button { font:inherit; font-weight:600; border:0; border-radius:8px; padding:8px 14px; background:rgba(255,255,255,.92); color:#1b1b1b; }
  .mapTop button.save { background:var(--accent); color:#fff; }
  .mapHint, .mapOffline { position:absolute; left:12px; right:12px; top:calc(64px + env(safe-area-inset-top)); text-align:center;
         font-size:13px; padding:6px 10px; border-radius:8px; background:rgba(0,0,0,.55); pointer-events:none; }
  .mapOffline { background:rgba(168,93,0,.92); top:calc(100px + env(safe-area-inset-top)); }
  .mapZoom { position:absolute; right:12px; top:45%; display:flex; flex-direction:column; gap:8px; }
  .mapZoom button { width:44px; height:44px; padding:0; font-size:24px; }
  .mapGps { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(40px + env(safe-area-inset-bottom)); }
  .mapCredit { position:absolute; right:6px; bottom:calc(6px + env(safe-area-inset-bottom)); font-size:10px;
         background:rgba(255,255,255,.75); color:#333; padding:1px 5px; border-radius:3px; }
  .planRow { display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); }
  .planRow a.item { flex:1; border-bottom:0; }
  .planRow a.item::after { content:none; }
  .planRow button.link { font-size:14px; white-space:nowrap; }
  button.newPlan { color:var(--accent); font-weight:600; }
  .warn { color:var(--caution); } .okText { color:var(--ok); }
  pre { white-space:pre-wrap; font-size:13px; background:var(--alt); padding:10px; border-radius:8px; }
  .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:8px 14px; border-radius:8px; font-size:14px; }
</style>
</head>
<body>
<header><h1 id="title">PHC Planner</h1><span id="actions"></span><button id="bug" aria-label="Report a bug or send feedback">🐞</button><button id="update" aria-label="Update app to the latest version">↻ Update</button></header>
<main id="view"><p>Loading…</p></main>
<nav class="tabs">
  <a href="#plans" data-tab="plans">Plans</a>
  <a href="#plan" data-tab="plan">Landscape</a>
  <a href="#library" data-tab="library">Library</a>
  <a href="#reference" data-tab="reference">Reference</a>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
