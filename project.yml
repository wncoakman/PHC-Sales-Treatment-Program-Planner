# Generate the Xcode project with: xcodegen generate
name: PHCPlanner
options:
  bundleIdPrefix: com.rtectreecare
  deploymentTarget:
    iOS: "17.0"
packages:
  PHCPlanner:
    path: .
targets:
  PHCPlanner:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: PHCPlanner
        product: PHCUI
    settings:
      base:
        PRODUCT_NAME: PHC Planner
        PRODUCT_BUNDLE_IDENTIFIER: com.rtectreecare.phcplanner
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""  # set to the RTEC Apple Developer team ID
